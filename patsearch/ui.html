<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priora — 선행기술 검색</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 강조색은 은은하게: 글씨는 차분한 청회색(--accent), 버튼·칩은 옅은 바탕(--accent-soft)에 조금 진한 글씨(--accent-strong) */
:root{--bg:#f4f4f1;--side:#ecece8;--card:#fff;--ink:#1c1d1f;--mute:#676b73;--line:#dcdde0;
--accent:#4b6a9b;--accent-strong:#35527f;--accent-soft:#e8eef7;--accent-line:#c3d0e6;
--ok:#0d7a4a;--ok-bg:#dff3e8;--warn:#8a5a00;--warn-bg:#fbeecb;--err:#b3261e;--err-bg:#fbe3e1;--idle:#676b73;--idle-bg:#e6e7ea}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--side:#1b1c20;--card:#212328;--ink:#e8e9eb;--mute:#9a9fa8;--line:#34373d;
--accent:#a9c1e6;--accent-strong:#c6d7f2;--accent-soft:#262f3f;--accent-line:#3d4a61;
--ok:#7fdcab;--ok-bg:#143a28;--warn:#f1c96b;--warn-bg:#40330f;--err:#ff8a80;--err-bg:#4a1f1c;--idle:#9a9fa8;--idle-bg:#2b2d32}}
*{box-sizing:border-box}
html,body{height:100%}
/* 글꼴: Pretendard(한글·영문 모두 고르게 보이는 무료 글꼴)를 쓰고, 받지 못하면 시스템 글꼴로 */
:root{--sans:"Pretendard Variable",Pretendard,"Segoe UI Variable Text","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);letter-spacing:-.1px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h2,h3,.brand h1{letter-spacing:-.3px}
.app{display:grid;grid-template-columns:310px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:11px;align-items:center;padding:16px 16px 12px;color:inherit;text-decoration:none}
.brand:hover h1{color:var(--accent)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:12px}
.brand img{width:38px;height:38px;cursor:pointer;border-radius:9px;transition:transform .5s}
.brand img.spin1{transform:rotate(360deg)}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px;line-height:1.2}
.brand .tag{color:var(--mute);font-size:12px}
.chip{font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap;display:inline-block}
.c-ok{color:var(--ok);background:var(--ok-bg)}.c-warn{color:var(--warn);background:var(--warn-bg)}
.c-err{color:var(--err);background:var(--err-bg)}.c-idle{color:var(--idle);background:var(--idle-bg)}
.c-run{color:var(--accent-strong);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
/* 창 가운데 위: 검색 / 구성대비 */
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.modes{display:inline-flex;gap:4px;padding:4px;background:var(--side);border:1px solid var(--line);border-radius:11px}
.mode{border:1px solid transparent;background:none;border-radius:8px;padding:7px 14px;min-width:140px;cursor:pointer;color:var(--mute);font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.mode .ic{font-size:13px;line-height:1;opacity:.85}
.mode:hover{color:var(--ink)}
.mode.on{background:var(--card);border-color:var(--accent-line);color:var(--accent-strong);box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* 실행 버튼(검색·구성대비 시작): 다른 primary 버튼과 같은 은은한 색, 아이콘만 붙인다 */
.btn.go{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong);font-weight:600;padding:7px 16px;display:inline-flex;gap:6px;align-items:center}
.btn.go:hover:not(:disabled){border-color:var(--accent)}
.btn.go .ic{font-size:13px;line-height:1}
.btn.stop{background:var(--err-bg);border-color:var(--err);color:var(--err);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.runbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:11px 14px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:9px;color:var(--accent-strong)}
.runbar .grow{flex:1;min-width:200px}
/* CLI 연결 */
.cli-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cli-card:first-of-type{border-top:0}
.cli-card .nm{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cli-card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.set-clis{margin-top:10px}
.set-cli{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.set-cli .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-cli .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.conn{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mute);background:none;border:0;cursor:pointer;padding:3px 4px;border-radius:6px;min-width:0}
.conn:hover{color:var(--ink);background:var(--card)}
.conn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.duo{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
.duo .card{margin-top:0;min-width:0}
@media (min-width:1240px){.duo{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:24px 14px;text-align:center;color:var(--mute);background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.file{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0;margin-top:8px}
.recog{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--bg)}
.recog .ln{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.recog .ln .how{white-space:nowrap}
.recog .ln .tx{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.recog .msg{margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong);font-weight:600}
.btn.danger{color:var(--err)}
.btn.wide{width:100%}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;color:var(--mute);font-size:12px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:inherit}
.link:hover{text-decoration:underline}
.link.quiet{color:var(--mute);font-size:12px}.link.quiet:hover{color:var(--err)}
.history{overflow-y:auto;flex:1;padding:0 8px 8px}
.item{position:relative;border-radius:8px;padding:9px 30px 9px 10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line)}
.item .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.item .s{color:var(--mute);font-size:12px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .del{position:absolute;right:6px;top:8px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;visibility:hidden}
.item:hover .del{visibility:visible}.item .del:hover{color:var(--err);background:var(--err-bg)}
.empty{color:var(--mute);padding:14px 10px;font-size:13px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center}
.side-foot .btn{flex:1;text-align:left}
main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.topbar{flex:none}
.wrap{flex:none;width:100%;max-width:1180px;margin:0 auto;padding:26px 28px 70px}
/* 검색 결과가 나온 기록: 후보 문헌 표가 남는 높이를 다 쓰고, 바깥 화면은 스크롤하지 않는다 */
.wrap:has(>iframe.report){flex:1 1 0;min-height:0;max-width:1560px;display:flex;flex-direction:column;padding:16px 22px 32px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:14.5px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:16px}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
textarea{width:100%;min-height:280px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:11px 12px;line-height:1.6}
input[type=text],input[type=password],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;height:36px}
input:disabled{opacity:.5}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.hint{color:var(--mute);font-size:12px;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.check{display:flex;gap:7px;align-items:center;margin:0;color:var(--ink);font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.msg{border-radius:8px;padding:9px 12px;margin-top:14px;font-size:13px}
.msg.err{color:var(--err);background:var(--err-bg)}.msg.warn{color:var(--warn);background:var(--warn-bg)}.msg.ok{color:var(--ok);background:var(--ok-bg)}
.steps{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:13px;color:var(--mute)}
.step b{display:block;font-size:11.5px;font-weight:600}
.step.done{color:var(--ok);border-color:var(--ok)}
.step.now{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.now b::after{content:" · 진행 중";color:var(--accent)}
pre.log{margin:10px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;max-height:340px;overflow:auto;font:12.5px/1.55 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word}
details>summary{cursor:pointer;font-weight:600}
.claim{white-space:pre-wrap;margin-top:10px}
iframe{width:100%;height:82vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
iframe.report{flex:1 1 0;height:auto;min-height:420px;margin-top:12px}
/* 청구항 · 진행 기록처럼 가끔만 보는 것은 누르면 뜨는 창에 */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(880px,92vw);max-height:86vh;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:14px 18px 18px;overflow:auto;min-height:0}
.dlg-body .claim{margin-top:0}
.dlg-body pre.log{margin:0;max-height:none}
.soon{border:1px dashed var(--line);border-radius:0 10px 10px 10px;background:var(--card);padding:30px 24px;color:var(--mute)}
/* 구성대비 기록: 결과(양식)는 왼쪽에 크게, 청구항 · 인용발명 PDF · 구성별 판정 · 종속항 입력은 오른쪽 옆 칸에 */
.wrap:has(>.cmp){max-width:1560px;padding:18px 22px 36px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:14px}
.cmp-main,.cmp-side{min-width:0;display:flex;flex-direction:column;gap:14px}
.cmp-main .card,.cmp-side .card{margin-top:0}
.cmp-side .card{padding:12px 14px}
.cmp-side summary{font-size:14px}
.cmp-side summary .sub{font-weight:400;margin-left:6px}
.cmp-side .claim{max-height:30vh;overflow:auto;font-size:13px;padding-right:4px}
.cmp-side .grid{grid-template-columns:1fr;gap:8px;margin-top:8px}
.cmp-side .row{margin-top:10px}
.cmp-side textarea{min-height:130px}
@media (min-width:1280px){
  .cmp{grid-template-columns:minmax(0,1fr) 400px;align-items:start}
  /* 옆 칸은 스크롤해도 제자리에 있고, 길면 칸 안에서 따로 스크롤한다 (아래 여백 36px 안쪽에서 끝나야 끝까지 내려도 밀려 올라가지 않는다) */
  .cmp-side{position:sticky;top:80px;max-height:calc(100vh - 122px);overflow-y:auto;padding-right:2px}
}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.res-head .row{margin-top:0}
h2.one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre.out{max-height:none;font:13.5px/1.7 var(--sans);margin-top:12px}
.docrow{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.docrow:first-child{border-top:0}
.docrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
/* 구성별 판정을 좁은 칸에 맞춘 표: 기호 하나가 판정 하나 */
.mx{border-collapse:collapse;width:100%;table-layout:fixed;margin-top:8px}
.mx th,.mx td{padding:5px 0;border-bottom:1px solid var(--line);text-align:center;font-size:12.5px}
.mx th{color:var(--mute);font-weight:600}
.mx .nm{text-align:left;padding-right:6px}
.mx .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.vd{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;cursor:default}
.vd.hint{box-shadow:inset 0 0 0 2px var(--warn)}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .vd{width:18px;height:18px;font-size:10.5px}
.dep-table{border-collapse:collapse;width:100%;margin-top:10px}
.dep-table th,.dep-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
/* 왼쪽 칸 위의 탭: 청구항 구성대비 / 종속항 구성대비 */
.tabs{display:flex;gap:4px;padding:4px;background:var(--side);border:1px solid var(--line);border-radius:11px;align-self:flex-start;flex-wrap:wrap}
.tabbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;border-radius:8px;padding:8px 18px;cursor:pointer;color:var(--mute);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);border-color:var(--accent-line);color:var(--accent-strong);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cmp-main details.card>summary{font-size:14.5px}
/* 구성대비 결과만 따로 띄운 창 (/#cmp=기록) */
body.pop .app{grid-template-columns:1fr}
body.pop aside,body.pop .topbar,body.pop .rights{display:none}
body.pop .wrap{max-width:1100px;padding:18px 22px 40px}
.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.keyrow{display:grid;grid-template-columns:190px 1fr auto;gap:12px;align-items:center;margin-top:12px}
@media (max-width:900px){.keyrow{grid-template-columns:1fr}}
.keyrow .name{font-weight:600}
.results{margin-top:12px}
.results div{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.results div:first-child{border-top:0}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .9s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.rights{position:fixed;right:16px;bottom:8px;font-size:11.5px;color:var(--mute);pointer-events:none;background:var(--bg);padding:1px 8px;border-radius:6px}
/* 이스터 에그 */
.bulb{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(300deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:51;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bulb{display:none}.brand img{transition:none}}
@media (max-width:760px){.app{grid-template-columns:1fr;height:auto}aside{max-height:46vh}main{overflow:visible}iframe.report{flex:none;height:80vh}}
</style></head>
<body>
<div class="app">
  <aside>
    <a class="brand" href="/" id="home" title="첫 화면으로"><img src="/emblem.svg" alt="" id="emblem"><div><h1 id="appName">Priora</h1><div class="tag" id="appTag">청구항 기반 선행기술 검색</div></div></a>
    <div class="side-head"><span>검색 기록 <span id="count"></span></span><button class="link quiet" id="clearAll">전체 삭제</button></div>
    <div class="history" id="history"></div>
    <div class="side-foot" style="padding-bottom:4px"><button class="conn" id="connBtn" title="CLI 로그인 상태 보기 · 로그인 / 로그아웃"><i class="dot" id="connDot"></i><span id="connText">CLI 연결 확인 중…</span></button></div>
    <div class="side-foot" style="border-top:0;padding-top:4px"><button class="btn" id="authBtn">🔌 CLI 연결</button><button class="btn" id="settingsBtn">⚙ 설정</button><span id="keyWarn"></span></div>
  </aside>
  <main>
    <div class="topbar"><div class="modes" role="tablist" aria-label="작업 고르기">
      <button class="mode" role="tab" data-mode="" title="청구항으로 선행기술을 검색합니다"><span class="ic">🔍</span>검색</button>
      <button class="mode" role="tab" data-mode="compare" title="가지고 있는 인용발명 PDF 와 청구항을 구성별로 대비합니다"><span class="ic">⇄</span>구성대비</button>
    </div></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);

const STATE = {running:['c-run','실행 중'], done:['c-ok','완료'], error:['c-err','오류'], stopped:['c-idle','중지됨'], interrupted:['c-warn','중단됨'], idle:['c-idle','구성대비용']};
const VERDICT = {same:['c-ok','실질적 동일'], partial:['c-warn','일부 차이'], none:['c-idle','차이']};
// 단계 목록. 대비 보고서 단계가 생기면 여기에 이어 붙인다.
const STEPS = ['구성 분해','검색식 생성','검색 실행','초록 스크리닝','리포트'];
const KEYS = [
  ['EPO_OPS_KEY', 'EPO Consumer Key', 'developers.epo.org → My Apps 의 Consumer Key'],

let app = {clis:[], keys:{stored:{}}, settings:{models:{}}, running:''}, list = [], current = null, timer = null, draft = null, lastState = '', view = 'form';

async function api(path, opt = {}) {

}
const ymd = s => s && s.length === 8 ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}` : '';

  return `${esc(cliLabel(s.cli))} · 검색 모델 ${esc(m.model || '기본값')} · 스크리닝 모델 ${esc(m.screen_model || '기본값')} · 특허 ${esc(s.max_screen)}건 스크리닝`;

function renderHistory() {
  $('#count').textContent = list.length ? `(${list.length})` : '';

  if (!list.length) { $('#history').innerHTML = '<div class="empty">아직 검색 기록이 없습니다.</div>'; return; }
  $('#history').innerHTML = list.map(it => {

}

// --- 입력 화면: 검색 / 구성대비 ------------------------------------------------
// 입력하던 청구항을 다른 화면에 다녀와도 잃지 않게 잠시 담아 둔다 (기준일 칸이 없는 구성대비 화면에서는 기준일을 그대로 들고 간다)
let formBefore = '';
function stashForm() {
  if (view !== 'form' || !$('#claim')) return;
  const ub = $('#useBefore');
  draft = {claim: $('#claim').value, before: ub ? (ub.checked ? $('#before').value : '') : formBefore};
}
function renderModes() {
  document.querySelectorAll('.mode').forEach(b => {
    const on = view === 'form' && b.dataset.mode === formMode;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
function renderForm(mode = '') {
  view = 'form'; formMode = mode; current = null; lastState = ''; stopPolling(); renderHistory(); renderModes();
  const d = draft || {}; draft = null; formBefore = d.before || '';
  if (mode === 'compare') return renderCompareForm(d);
  $('#view').innerHTML = `
    <h2>검색</h2>
    <div class="sub">청구항(주로 독립항)을 붙여 넣고 검색을 누르면 구성 분해 → 검색식 생성 → 특허·논문 검색 → 초록 스크리닝 순으로 진행합니다. 진행 중에는 언제든 중지할 수 있습니다.</div>
    <div class="card">
      <label for="claim">청구항</label>
      <textarea id="claim" placeholder="청구항 1.&#10;…">${esc(d.claim || '')}</textarea>
      <div class="hint">종속항이나 명세서 요지를 아래에 덧붙여도 됩니다. 필수는 아닙니다.</div>
      <div class="row">
        <label class="check"><input type="checkbox" id="useBefore" ${d.before ? 'checked' : ''}> 기준일 적용</label>
        <input type="date" id="before" value="${esc(d.before || '')}" style="width:170px" ${d.before ? '' : 'disabled'}>
        <span class="sub" id="beforeHint"></span>
      </div>
      <div id="formMsg"></div>
      <div class="row" style="margin-top:20px"><button class="btn go" id="go"><span class="ic">🔍</span>검색</button><span class="sub" id="goHint"></span></div>
      <div class="hint" style="margin-top:14px">실행 설정: ${settingsLine()} · <button class="link" id="toSettings">설정 바꾸기</button></div>
    </div>`;
  const sync = () => {
    const on = $('#useBefore').checked; $('#before').disabled = !on;
    $('#beforeHint').textContent = on ? '이 날짜 이전에 공개된 문헌만 검색합니다 (보통 우선일).' : '적용하지 않으면 공개일 제한 없이 검색합니다.';
  };
  $('#useBefore').onchange = () => { sync(); if ($('#useBefore').checked) $('#before').focus(); };
  sync();
  $('#go').onclick = submit;
  $('#toSettings').onclick = renderSettings;
  if (!app.keys.ops) $('#formMsg').innerHTML = '<div class="msg warn">EPO 키가 없어 특허 검색은 건너뛰고 논문만 검색합니다. <button class="link" id="toSettings2">설정에서 키 입력</button></div>';
  if ($('#toSettings2')) $('#toSettings2').onclick = renderSettings;
  if (app.running) { $('#go').disabled = true; $('#goHint').innerHTML = '실행 중인 검색이 끝나거나 중지하면 새로 시작할 수 있습니다. <button class="link" id="toRunning">실행 중인 검색 보기</button>'; $('#toRunning').onclick = () => select(app.running); }
}
async function submit() {
  const useBefore = $('#useBefore').checked, before = $('#before').value;
  if (useBefore && !before) { $('#formMsg').innerHTML = '<div class="msg err">기준일을 적용하려면 날짜를 고르세요. 날짜 없이 검색하려면 "기준일 적용"을 끄세요.</div>'; return; }
  const wasDisabled = $('#go').disabled; $('#go').disabled = true;
  try { const r = await api('/api/runs', {method: 'POST', body: JSON.stringify({claim: $('#claim').value, before: useBefore ? before : ''})}); await refresh(); select(r.id); }
  catch (e) { $('#formMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; $('#go').disabled = wasDisabled; }
}

// --- 구성대비 첫 화면: 청구항과 인용발명 PDF 를 한 번에 넣는다 -------------------------
const MAX_PDFS = 12, MAX_PDF_MB = 40;
let pendingPdfs = [], compareNotice = '';  // pendingPdfs: 아직 올리지 않고 골라 둔 PDF · compareNotice: 다음 구성대비 화면에 한 번 보여 줄 알림
async function uploadPdf(id, f) {
  const res = await fetch(`/api/runs/${id}/compare/docs`, {method: 'POST', body: f, headers: {'Content-Type': 'application/pdf', 'X-Patsearch': '1', 'X-Filename': encodeURIComponent(f.name)}});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `${f.name}: 업로드 실패`);
  return j;
}
// 붙여 넣은 청구항을 프로그램이 어떻게 나눠 읽었는지 입력칸 아래에 보여 준다
function recogHtml(r) {
  if (r.error) return `<div class="msg warn">${esc(r.error)}</div>`;
  const lines = [];
  if (r.base) lines.push(`<div class="ln"><span class="chip c-run">청구항 ${esc(r.base.no)}</span><span class="how">독립항 · 먼저 대비</span><span class="tx">${esc(r.base.snippet)}</span></div>`);
  for (const d of r.deps) lines.push(`<div class="ln"><span class="chip c-idle">청구항 ${esc(d.no)}</span><span class="how">← ${esc(d.ref_label)}</span>${d.detached ? '<span class="chip c-warn" title="인용하는 항의 대비 기록이 없어, 이 항이 더한 구성만 대비합니다">대비 기록 없음</span>' : ''}<span class="tx">${esc(d.snippet)}</span></div>`);
  const head = r.add ? (r.deps.length ? `이렇게 나눠 읽었습니다 — 새로 넣는 종속항 ${r.deps.length}건` : '새로 넣을 종속항을 찾지 못했습니다')
    : r.deps.length ? `이렇게 나눠 읽었습니다 — ${r.base ? '독립항 1건, ' : ''}종속항 ${r.deps.length}건` : '독립항 하나로 읽었습니다 (종속항 없음)';
  return `<div class="recog"><div class="sub">${head}</div>${lines.join('')}${(r.notes || []).map(n => `<div class="msg warn">${esc(n)}</div>`).join('')}</div>`;
}
function watchClaims(area, out, extra = {}) {
  let t = null, seq = 0;
  const run = async () => {
    const text = area.value.trim(), my = ++seq;
    if (text.length < 20) { out.innerHTML = ''; return; }
    let r; try { r = await api('/api/claims/preview', {method: 'POST', body: JSON.stringify({...extra, text})}); } catch { return; }
    if (my === seq && out.isConnected) out.innerHTML = recogHtml(r);
  };
  area.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 450); });
  run();
}
function renderCompareForm(d) {
  $('#view').innerHTML = `
    <h2>구성대비</h2>
    <div class="sub">청구항과 인용발명 PDF 를 넣고 시작하면 청구항을 구성별로 인용발명과 대비합니다. 진행 중에는 언제든 중지할 수 있습니다.</div>
    <div class="duo">
      <div class="card">
        <label for="claim">청구항</label>
        <textarea id="claim" placeholder="청구항 1.&#10;…&#10;&#10;청구항 2.&#10;제1항에 있어서, …">${esc(d.claim || '')}</textarea>
        <div class="hint">독립항만 넣어도 되고, 종속항 여러 개를 한꺼번에 붙여 넣어도 됩니다. 항은 프로그램이 나눠, 가장 앞 번호의 독립항을 먼저 대비하고 종속항을 이어서 대비합니다. 독립항 없이 종속항만 넣으면 항마다 더한 구성만 대비하고 결론은 쓰지 않습니다.</div>
        <div id="claimRecog"></div>
      </div>
      <div class="card">
        <label for="pdfInput">인용발명 PDF</label>
        <div class="drop" id="drop">PDF 를 여기에 끌어다 놓거나 <button class="link" id="pick">파일 고르기</button>
          <input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden></div>
        <div id="pdfList"></div>
        <div id="pdfMsg"></div>
        <div class="hint">텍스트가 들어 있는 PDF 만 쓸 수 있습니다 (스캔본 불가). ${MAX_PDFS}건까지, 파일당 ${MAX_PDF_MB}MB 이하. 특허는 단락 번호([0019])로, 논문은 쪽 번호로 발췌 위치를 적습니다.</div>
      </div>
    </div>
    <div id="formMsg"></div>
    <div class="row" style="margin-top:20px"><button class="btn go" id="goCompare"><span class="ic">⇄</span>구성대비 시작</button><span class="sub" id="goHint"></span></div>
    <div class="hint" style="margin-top:14px">실행 설정: ${settingsLine('compare')} · <button class="link" id="toSettings">설정 바꾸기</button></div>`;
  const listPdfs = () => {
    $('#pdfList').innerHTML = pendingPdfs.map((f, i) => `<div class="file"><span style="flex:1;min-width:0;overflow-wrap:anywhere"><b>${esc(f.name)}</b> <span class="sub">${(f.size / 1048576).toFixed(1)}MB</span></span><button class="link quiet" data-drop="${i}">빼기</button></div>`).join('');
    $('#pdfList').querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { pendingPdfs.splice(Number(b.dataset.drop), 1); listPdfs(); });
    $('#goHint').textContent = pendingPdfs.length ? `인용발명 ${pendingPdfs.length}건으로 바로 대비를 시작합니다.` : '인용발명 없이 시작하면 청구항만 기록해 두고, 다음 화면에서 PDF 를 넣습니다.';
  };
  const addPdfs = files => {
    const msgs = [];
    for (const f of files) {
      if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { msgs.push(`${f.name}: PDF 파일이 아닙니다`); continue; }
      if (f.size > MAX_PDF_MB * 1048576) { msgs.push(`${f.name}: 파일이 너무 큽니다 (${MAX_PDF_MB}MB 이하)`); continue; }
      if (pendingPdfs.some(p => p.name === f.name && p.size === f.size)) continue;  // 같은 파일을 두 번 고른 경우
      if (pendingPdfs.length >= MAX_PDFS) { msgs.push(`인용발명은 ${MAX_PDFS}건까지 넣을 수 있습니다`); break; }
      pendingPdfs.push(f);
    }
    $('#pdfMsg').innerHTML = msgs.map(m => `<div class="msg warn">${esc(m)}</div>`).join('');
    listPdfs();
  };
  const drop = $('#drop');
  for (const n of ['dragenter', 'dragover']) drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); });
  for (const n of ['dragleave', 'drop']) drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); });
  drop.addEventListener('drop', e => addPdfs([...e.dataTransfer.files]));
  $('#pick').onclick = () => $('#pdfInput').click();
  $('#pdfInput').onchange = e => { addPdfs([...e.target.files]); e.target.value = ''; };
  listPdfs();
  watchClaims($('#claim'), $('#claimRecog'));
  $('#goCompare').onclick = submitCompare;
  $('#toSettings').onclick = renderSettings;
}
async function submitCompare() {
  const say = (html, cls) => { $('#formMsg').innerHTML = `<div class="msg ${cls}">${html}</div>`; };
  $('#goCompare').disabled = true;
  let r;
  try { r = await api('/api/runs', {method: 'POST', body: JSON.stringify({claim: $('#claim').value, mode: 'compare'})}); }
  catch (e) { say(esc(e.message), 'err'); $('#goCompare').disabled = false; return; }
  // 기록이 만들어졌으니 골라 둔 PDF 를 차례로 올리고, 모두 올라가면 바로 대비를 시작한다
  const files = pendingPdfs, failed = []; pendingPdfs = [];
  for (const [i, f] of files.entries()) {
    say(`<span class="spin"></span>인용발명 PDF 를 넣는 중 (${i + 1}/${files.length}) — ${esc(f.name)}`, 'warn');
    try { await uploadPdf(r.id, f); } catch (e) { failed.push(e.message); }
  }
  if (files.length && !failed.length) { try { await api(`/api/runs/${r.id}/compare/start`, {method: 'POST', body: '{}'}); } catch (e) { failed.push(e.message); } }
  if (failed.length) compareNotice = failed.join(' / ') + ' — 넣지 못한 문헌이 있어 대비를 시작하지 않았습니다. 아래에서 확인한 뒤 "구성대비 시작"을 누르세요.';
  await refresh(); select(r.id);
}

// --- 설정 ---------------------------------------------------------------------
function modelField(id, labelText, hint) {
  return `<div><label for="${id}">${labelText}</label><select id="${id}"></select>
    <input type="text" id="${id}Custom" placeholder="모델 이름 직접 입력" style="display:none;margin-top:6px">
    <div class="hint">${hint}</div></div>`;
}
function fillModels(id, cli, value) {
  // 기본 목록에, 로그인 상태 확인 때 CLI 가 알려 준 실제 모델 목록(agy models 등)을 덧붙인다
  const live = ((auth && auth.clis.find(c => c.id === cli)) || {}).models || [];
  const models = [...new Set([...((app.clis.find(c => c.id === cli) || {}).models || []), ...live])];
  const sel = $('#' + id), custom = $('#' + id + 'Custom');
  sel.innerHTML = `<option value="">기본값 (CLI 설정)</option>` + models.map(m => `<option>${esc(m)}</option>`).join('') + `<option value="__custom">직접 입력…</option>`;
  if (value && !models.includes(value)) { sel.value = '__custom'; custom.value = value; } else { sel.value = value || ''; custom.value = ''; }
  const sync = () => { custom.style.display = sel.value === '__custom' ? '' : 'none'; };
  sel.onchange = sync; sync();
}
const modelValue = id => $('#' + id).value === '__custom' ? $('#' + id + 'Custom').value.trim() : $('#' + id).value;

// 설정을 닫고, 열기 전에 보던 화면(검색 기록 또는 입력 화면)으로 돌아간다
function leaveSettings() {
  const id = settingsBack; settingsBack = null;
  if (id && list.some(x => x.id === id)) select(id); else renderForm(formMode);
}
function renderSettings() {
  if (view !== 'settings' && view !== 'auth') { settingsBack = current; stashForm(); }  // 저장 뒤 다시 그릴 때는 돌아갈 곳을 바꾸지 않는다
  view = 'settings'; current = null; stopPolling(); renderHistory(); renderModes();
  const s = JSON.parse(JSON.stringify(app.settings)), stored = app.keys.stored || {};
  $('#view').innerHTML = `
    <div class="titlebar"><div><h2>설정</h2>
      <div class="sub">여기서 저장한 값은 다음 검색부터 적용됩니다. 터미널에서 실행할 때도 같은 값을 기본으로 씁니다.</div></div>
      <button class="btn" data-leave>← 돌아가기</button></div>
    <div class="card">

      ${KEYS.map(([name, label, hint]) => `<div class="keyrow">

// --- CLI 연결: 설치·로그인 상태, 로그인 / 로그아웃 ------------------------------------------
let auth = null, authBusy = false;  // auth: 마지막으로 받은 /api/auth 결과
function authChip(c) {
  if (!c.installed) return '<span class="chip c-idle">설치 안 됨</span>';
  if (c.logged_in === true) return '<span class="chip c-ok">● 연결됨</span>';
  if (c.logged_in === false) return '<span class="chip c-err">로그인 필요</span>';
  return '<span class="chip c-warn">확인 불가</span>';
}
function renderConn() {
  const cur = auth && auth.clis.find(c => c.id === app.settings.cli);
  const dot = $('#connDot'), text = $('#connText');
  if (!cur) { dot.className = 'dot'; text.textContent = `${cliLabel(app.settings.cli) || 'CLI'} · 연결 확인 중…`; return; }
  const ok = cur.installed && cur.logged_in === true;
  dot.className = 'dot ' + (ok ? 'ok' : cur.installed && cur.logged_in == null ? 'warn' : 'err');
  text.textContent = `${cur.label} · ${!cur.installed ? '설치 안 됨' : cur.logged_in === true ? '연결됨' : cur.logged_in === false ? '로그인 필요' : '확인 불가'}`;
}
async function loadAuth() {
  try { auth = await api('/api/auth'); } catch { auth = null; }
  renderConn();

}
let refillSettingsModels = () => {};
// CLI 하나에 붙는 버튼들: 로그인/로그아웃, (연결 화면에서만) 다시 로그인, 업데이트
function cliActs(c, full) {
  if (!c.installed) return '';
  const id = esc(c.id);
  return (c.logged_in === true
      ? `<button class="btn danger" data-auth="logout" data-cli="${id}">로그아웃</button>`
      : `<button class="btn primary" data-auth="login" data-cli="${id}">로그인</button>`)
    + (full && c.logged_in === true ? `<button class="btn" data-auth="login" data-cli="${id}" title="다른 계정으로 다시 로그인">다시 로그인</button>` : '')
    + `<button class="btn" data-auth="update" data-cli="${id}" title="CLI 를 최신 버전으로 업데이트">⟳ 업데이트</button>`;
}
function bindActs(box) { box.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => authAction(b.dataset.cli, b.dataset.auth, b)); }
// 설정 화면의 LLM 카드 안에 CLI 마다 상태와 버튼을 한 줄씩 보여 준다
function drawSetClis() {
  const box = $('#setCliList'); if (!box) return;
  if (!auth) { box.innerHTML = '<div class="sub"><span class="spin"></span>CLI 로그인 상태를 확인하는 중…</div>'; return; }
  box.innerHTML = auth.clis.map(c => `<div class="set-cli">
      <div class="nm"><i class="dot ${!c.installed ? '' : c.logged_in === true ? 'ok' : c.logged_in === false ? 'err' : 'warn'}"></i>${esc(c.label)}
        ${authChip(c)}${c.version ? `<span class="hint" style="margin:0">${esc(c.version)}</span>` : ''}</div>
      <div class="acts">${cliActs(c, false)}</div></div>`).join('');
  bindActs(box);
}
function renderAuth() {
  if (view !== 'auth' && view !== 'settings') { settingsBack = current; stashForm(); }
  view = 'auth'; current = null; stopPolling(); renderHistory(); renderModes();
  $('#view').innerHTML = `
    <div class="titlebar"><div><h2>🔌 CLI 연결</h2>
      <div class="sub">검색과 구성대비는 이 PC에 설치된 LLM CLI 의 로그인 계정으로 동작합니다. 여기서 연결 상태를 보고 로그인·로그아웃할 수 있습니다.</div></div>
      <div class="row" style="margin-top:0"><button class="btn" id="authRefresh">↻ 상태 새로고침</button><button class="btn" data-leave>← 돌아가기</button></div></div>
    <div id="authMsg"></div>
    <div class="card" id="authList"><div class="sub"><span class="spin"></span>CLI 마다 상태를 확인하는 중입니다 (몇 초 걸립니다)…</div></div>
    <div class="hint" style="margin-top:12px">로그인은 새 창(콘솔)에서 진행됩니다. 브라우저에서 로그인을 마친 뒤 그 창을 닫고 "상태 새로고침"을 누르세요. 사용할 CLI 는 <button class="link" id="authToSettings">설정</button>에서 고릅니다.</div>`;

function drawAuth() {
  const box = $('#authList'); if (!box || !auth) return;

      <div><div class="nm"><i class="dot ${!c.installed ? '' : c.logged_in === true ? 'ok' : c.logged_in === false ? 'err' : 'warn'}"></i>${esc(c.label)}
        ${authChip(c)}${c.id === auth.current ? '<span class="chip c-run">사용 중</span>' : ''}</div>
        <div class="sub" style="margin-top:3px">${esc(c.detail || '')}</div>

async function authAction(id, action, btn) {
  const label = cliLabel(id);
  if (action === 'logout' && !confirm(`${label} 에서 로그아웃할까요?\n\n이 CLI 를 쓰는 검색·구성대비는 다시 로그인할 때까지 실행되지 않습니다.`)) return;
  if (authBusy) return; authBusy = true; btn.disabled = true;
  const say = (html, cls) => { const box = $('#authMsg') || $('#setMsg'); if (box) box.innerHTML = `<div class="msg ${cls}">${html}</div>`; };
  const name = {login: '로그인', logout: '로그아웃', update: '업데이트'}[action];
  const refresh = view === 'auth' ? '<b>상태 새로고침</b>을 누르세요' : '이 화면을 다시 열면 상태가 갱신됩니다';
  try {
    const r = await api(`/api/auth/${id}/${action}`, {method: 'POST', body: '{}'});
    if (r.opened) say(`${esc(label)} ${name} 창을 열었습니다. 그 창에서 마친 뒤 닫고 ${refresh}.`, 'warn');
    else say(`${esc(label)} 에서 로그아웃했습니다.`, 'ok');
    if (auth) auth.clis = auth.clis.map(c => c.id === id ? r.status : c);
    renderConn(); drawAuth(); drawSetClis();
  } catch (e) { say(esc(e.message), 'err'); btn.disabled = false; }
  authBusy = false;
}

// --- 검색 기록 상세 --------------------------------------------------------------
function stepsHtml(it) {
  return STEPS.map((s, i) => `<div class="step ${i < it.progress ? 'done' : (it.state === 'running' && i === it.progress ? 'now' : '')}"><b>${i + 1}단계</b>${s}</div>`).join('');
}
function actionsHtml(it) {
  const b = [];
  if (it.state === 'running') {
    if (!it.can_stop) b.push('<span class="sub">터미널에서 실행 중인 검색입니다</span>');
    b.push('<button class="btn" data-act="claim">청구항</button>');
  } else {
    if (!it.has_report) b.push(`<button class="btn primary" data-act="resume" ${app.running ? 'disabled' : ''}>이어서 실행</button>`);
    if (it.has_report) {
      b.push('<button class="btn primary" data-act="cands" title="후보 문헌 표만 따로 새 창에 띄웁니다">후보 문헌 새 창으로</button>');
      b.push(`<a class="btn" href="/runs/${esc(it.id)}/report.html" target="_blank" rel="noopener" title="청구항 · 구성 분해 · 검색식 로그까지 모두 담은 리포트">전체 리포트</a>`);
    }
    b.push('<button class="btn" data-act="claim">청구항</button>');
    if (it.has_report) b.push('<button class="btn" data-act="log">진행 기록</button>');
    b.push('<button class="btn" data-act="again">같은 청구항으로 다시 검색</button>');
    b.push('<button class="btn danger" data-act="delete">삭제</button>');
  }
  return b.join('');
}
// 실행 중일 때 눈에 띄게 보이는 중지 막대
function runbarHtml(text, act) {
  return `<div class="runbar"><span class="spin"></span><span class="grow">${text}</span><button class="btn stop" data-act="${act}">■ 중지</button></div>`;
}
function metaLine(it) {
  const m = it.meta || {}, parts = [esc(it.created || '')];
  if (m.cli) parts.push(`${esc(cliLabel(m.cli))} · 검색 ${esc(m.model || '기본값')} · 스크리닝 ${esc(m.screen_model || '기본값')}`);
  parts.push(m.before ? `기준일 ${esc(ymd(m.before))}` : '기준일 없음');
  return parts.join(' · ');
}
let detail = null;  // 지금 보고 있는 기록 (청구항 · 진행 기록 창에 쓴다)
function showDialog(title, html) {
  $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = html; $('#dlg').showModal();
  const log = $('#dlgBody pre.log'); if (log) $('#dlgBody').scrollTop = $('#dlgBody').scrollHeight;
}
function renderDetail(it) {
  view = 'detail'; lastState = it.state; detail = it; renderModes();
  const running = it.state === 'running';
  // 결과가 나온 뒤에는 단계 · 진행 기록 · 청구항을 화면에서 빼고 후보 문헌만 보여 준다 (청구항 · 진행 기록은 위 버튼으로)
  const showReport = it.has_report && !running;
  // 검색 기록은 검색 결과만, 구성대비 기록은 구성대비만 보여 준다
  if (isCompare(it)) {
    // 제목 줄(청구항 첫머리 · 날짜)은 두지 않는다: 왼쪽 기록 목록에 같은 내용이 있고, 삭제도 거기서 한다. 결과를 볼 자리를 넓힌다
    $('#view').innerHTML = '<div class="cmp" id="tabBody" style="margin-top:0"></div>';
    return loadCompare(it.id);
  }
  $('#view').innerHTML = `
    <div class="titlebar"><div><h2>${esc(titleOf(it))}</h2><div class="sub">${badge(it.state)} ${metaLine(it)}</div></div>
      <div class="row" style="margin-top:0" id="dActions">${actionsHtml(it)}</div></div>
    ${running && it.can_stop ? runbarHtml('검색 중입니다. 중지하면 지금까지 받은 결과는 남고, 나중에 이어서 실행할 수 있습니다.', 'stop') : ''}
    ${it.message && it.state !== 'done' ? `<div class="msg ${it.state === 'error' ? 'err' : 'warn'}">${esc(it.message)}</div>` : ''}
    ${showReport ? `<iframe class="report" title="후보 문헌" src="/runs/${esc(it.id)}/candidates.html"></iframe>` : `
    <div class="steps" id="dSteps">${stepsHtml(it)}</div>
    <div class="card"><h3>진행 기록</h3><pre class="log" id="dLog"></pre></div>`}`;
  setLog(it.log, true);

// --- 구성대비 ---------------------------------------------------------------
let ctimer = null;
function stopCompare() { if (ctimer) { clearInterval(ctimer); ctimer = null; } }
async function loadCompare(id) {
  let c; try { c = await api(`/api/runs/${id}/compare`); } catch (e) { $('#tabBody').innerHTML = `<div class="soon"><div class="msg err">${esc(e.message)}</div></div>`; return; }
  renderCompare(id, c);
  if (c.state === 'running' && !ctimer) ctimer = setInterval(async () => {
    if (current !== id || !$('#cmpLog')) return stopCompare();
    let n; try { n = await api(`/api/runs/${id}/compare`); } catch { return; }
    if (n.state !== 'running') { stopCompare(); renderCompare(id, n); } else { const el = $('#cmpLog'); el.textContent = n.log; el.scrollTop = el.scrollHeight; }
  }, 2000);
}
// 클립보드 권한이 없으면 보이지 않는 입력칸에 글을 넣고 선택해 복사한다
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (done) done.textContent = '복사했습니다';
}
// 구성대비 결과(양식) 카드들. 기록 화면의 왼쪽 칸과, 결과만 따로 띄운 창이 같이 쓴다.
// only: 'claim' 이면 청구항 양식만, 'dep' 이면 종속항 표와 양식만, 비우면 둘 다
// bare: 양식 카드에 제목 줄(구성대비 (청구항 1) · 복사 · 새 창으로)을 두지 않는다. 그 버튼은 탭 줄에 있다
// 양식 맨 위에 붙이는 대응표(인용발명 1: 문헌 이름). n 을 주면 앞에서 n 건만(청구항 양식에는 그 항에 쓴 인용발명만)
function legendOf(r, n) {
  const lines = (r.legend || []).slice(0, n);
  return lines.length ? lines.join('\n') + '\n\n' : '';
}
function resultCards(c, pop, only = '', bare = false) {
  const r = c.result; if (!r) return '';
  const claimText = legendOf(r, (r.order || []).length) + r.text, depText = legendOf(r) + r.dep_text;
  const alone = !!c.alone, deps = r.dependents || [];

    if (!confirm('실행 중인 구성대비를 중지할까요?\n다시 실행하면 처음부터 대비합니다.')) return;
    cstop.disabled = true; stopCompare();
    try { renderCompare(id, await api(`/api/runs/${id}/compare/stop`, {method: 'POST', body: '{}'})); } catch (e) { fail(e); loadCompare(id); }
  };
  if (r) {
    const compose = async body => { try { renderCompare(id, await api(`/api/runs/${id}/compare/compose`, {method: 'POST', body: JSON.stringify(body)})); } catch (e) { fail(e); } };
    if (!alone) {  // 종속항만 대비한 기록에는 바꿀 청구항 1 순서도, 청구항 1 양식도 없다
      $('#cmpCompose').onclick = () => {
        const a = $('#cmp1').value, b = $('#cmp2').value, d = $('#cmp3').value;
        compose({primary: a, extra: b === 'auto' ? null : [b, d].filter(x => x !== 'none' && x !== 'auto' && x !== a)});
      };
      $('#cmpAuto').onclick = () => compose({primary: '', extra: null});
    }
    bindResult($('#tabBody'), c, id);
    $('#tabBody').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { cmpTab = {id, tab: b.dataset.tab}; renderCompare(id, c); });
    if ($('#depText')) watchClaims($('#depText'), $('#depRecog'), {run: id});
    if ($('#depStart')) $('#depStart').onclick = async () => {
      $('#depStart').disabled = true; cmpTab = {id, tab: 'dep'}; sideOpen.depin = undefined;
      const text = $('#depText').value; depDraft = null;
      try { const n = await api(`/api/runs/${id}/compare/dependents`, {method: 'POST', body: JSON.stringify({text})}); if (n.state === 'running') loadCompare(id); else renderCompare(id, n); }
      catch (e) { depDraft = text; $('#depMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; $('#depStart').disabled = false; }
    };
    if ($('#depAddText')) watchClaims($('#depAddText'), $('#depAddRecog'), {run: id, add: true});
    if ($('#depAdd')) $('#depAdd').onclick = async () => {
      $('#depAdd').disabled = true; cmpTab = {id, tab: 'dep'};
      const text = $('#depAddText').value; depAddDraft = null; depDraft = null;  // 합친 글이 "넣어 둔 종속항" 칸에 새로 들어온다
      try { const n = await api(`/api/runs/${id}/compare/dependents`, {method: 'POST', body: JSON.stringify({text, add: true})}); sideOpen.depadd = undefined; if (n.state === 'running') loadCompare(id); else renderCompare(id, n); }
      catch (e) { depAddDraft = text; $('#depAddMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; $('#depAdd').disabled = false; }
    };
  }
  if (bc) bc.postMessage({id});  // 따로 띄운 창이 있으면 같은 결과로 다시 그리게 한다
}

// --- 구성대비 결과만 따로 띄운 창 (/#cmp=기록) ---------------------------------------
const POP = (location.hash.match(/^#cmp=([\w.-]+)$/) || [])[1] || '';
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('priora-compare') : null;
let popTimer = null;
async function renderPop() {
  clearTimeout(popTimer);
  let it, c;
  try { [it, c] = await Promise.all([api(`/api/runs/${POP}`), api(`/api/runs/${POP}/compare`)]); }
  catch (e) { $('#view').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  document.title = `구성대비 — ${titleOf(it).slice(0, 40)}`;
  const r = c.result, nameOf = d => (c.docs.find(x => x.id === d) || {}).name || d;
  const refs = r ? (r.numbering || r.order || []).map((d, i) => `인용발명 ${i + 1}: <b>${esc(nameOf(d))}</b>`).join(' · ') : '';
  const keep = $('main').scrollTop;
  $('#view').innerHTML = `
    <div class="titlebar" style="flex-wrap:nowrap"><div style="min-width:0"><h2 class="one" title="${esc(titleOf(it))}">⇄ ${esc(titleOf(it))}</h2><div class="sub">${refs || esc(it.created || '')}</div></div>
      <div class="row" style="margin-top:0;flex:none"><button class="btn" id="popClaim" title="청구항 전문을 봅니다">청구항 보기</button></div></div>
    <div class="cmp-main" style="margin-top:14px">${c.state === 'running' ? '<div class="runbar" style="margin-top:0"><span class="spin"></span><span class="grow">구성대비 중입니다. 끝나면 이 창에 결과가 나옵니다.</span></div>'
      : resultCards(c, true) || '<div class="soon" style="border-radius:10px">아직 구성대비 결과가 없습니다.</div>'}</div>`;
  $('#popClaim').onclick = () => showDialog('청구항', `<div class="claim">${esc(it.claim)}</div>`);
  bindResult($('#view'), c, POP);
  $('main').scrollTop = keep;
  if (c.state === 'running') popTimer = setTimeout(renderPop, 2500);
}
function setLog(text, force) {
  const el = $('#dLog'); if (!el) return;
  const atEnd = force || el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.textContent = text || '(기록 없음 — 이 화면이 생기기 전에 터미널에서 실행한 검색입니다)';
  if (atEnd) el.scrollTop = el.scrollHeight;
}
async function onAction(e) {
  const act = e.target.closest?.('[data-act]')?.dataset.act; if (!act || !current) return;
  try {
    if (act === 'stop') {
      if (!confirm('실행 중인 검색을 중지할까요?\n지금까지 받은 결과는 남고, 나중에 이어서 실행할 수 있습니다.')) return;
      e.target.closest('button').disabled = true;
      await api(`/api/runs/${current}/stop`, {method: 'POST'});
    }
    if (act === 'resume') await api(`/api/runs/${current}/resume`, {method: 'POST'});
    if (act === 'delete') return removeRun(current);
    if (act === 'cands') { window.open(`/runs/${current}/candidates.html`, 'cands-' + current, 'popup,width=1400,height=900'); return; }
    if (act === 'claim') return showDialog('청구항', `<div class="claim">${esc((detail || {}).claim)}</div>`);
    if (act === 'log') return showDialog('진행 기록', `<pre class="log">${esc((detail || {}).log || '(기록 없음 — 이 화면이 생기기 전에 터미널에서 실행한 검색입니다)')}</pre>`);
    if (act === 'again') { const d = await api(`/api/runs/${current}`); draft = {claim: d.claim, before: ymd((d.meta || {}).before)}; return renderForm(); }
    await refresh(); select(current);
  } catch (err) { alert(err.message); }
}
async function removeRun(id) {
  const it = list.find(x => x.id === id);
  if (!confirm(`이 검색 기록을 삭제할까요?\n\n${titleOf(it || {id})}\n\n결과 파일이 모두 지워지며 되돌릴 수 없습니다.`)) return;
  try { await api(`/api/runs/${id}`, {method: 'DELETE'}); const wasCurrent = current === id; if (wasCurrent) current = null; await refresh(); if (wasCurrent) renderForm(); }
  catch (err) { alert(err.message); }
}
async function select(id) {
  current = id; renderHistory(); stopPolling();
  try { renderDetail(await api(`/api/runs/${id}`)); } catch (err) { current = null; return renderForm(); }
  if (lastState === 'running') timer = setInterval(poll, 2000);
}
function stopPolling() { if (timer) { clearInterval(timer); timer = null; } stopCompare(); }
async function poll() {
  if (!current) return stopPolling();
  let it; try { it = await api(`/api/runs/${current}`); } catch { return; }
  if (it.state !== lastState) { stopPolling(); await refresh(); return select(current); }
  detail = it; if ($('#dSteps')) $('#dSteps').innerHTML = stepsHtml(it); setLog(it.log, false);
}
async function refresh() {
  [app, list] = await Promise.all([api('/api/state'), api('/api/runs')]);
  renderChrome(); renderHistory();
}

// 위쪽 탭(검색 / 구성대비). 두 입력 화면을 오갈 때는 쓰던 청구항을 가져가고, 지금 탭을 다시 눌러도 쓰던 내용은 그대로 둔다.
const openForm = mode => {
  if (view === 'form' && formMode === mode) { $('main').scrollTop = 0; return; }
  stashForm(); renderForm(mode);
};
document.querySelectorAll('.mode').forEach(b => b.onclick = () => openForm(b.dataset.mode));
$('#home').onclick = e => { e.preventDefault(); openForm(''); };  // 이름·엠블럼 → 첫 화면(검색)
$('#dlgClose').onclick = () => $('#dlg').close();
$('#dlg').onclick = e => { if (e.target === $('#dlg')) $('#dlg').close(); };  // 창 바깥을 누르면 닫는다
$('#settingsBtn').onclick = () => renderSettings();
$('#authBtn').onclick = () => renderAuth();
$('#connBtn').onclick = () => renderAuth();
$('#history').onclick = e => {
  const del = e.target.closest('[data-del]'); if (del) { e.stopPropagation(); return removeRun(del.dataset.del); }
  const item = e.target.closest('.item'); if (item) { stashForm(); select(item.dataset.id); }
};
// PDF 를 칸 밖에 떨어뜨려도 브라우저가 그 파일로 넘어가 버리지 않게 한다
for (const n of ['dragover', 'drop']) window.addEventListener(n, e => e.preventDefault());
$('#clearAll').onclick = async () => {
  const n = list.filter(x => x.state !== 'running').length; if (!n) return;
  if (!confirm(`검색 기록 ${n}건을 모두 삭제할까요?\n\n결과 파일이 모두 지워지며 되돌릴 수 없습니다.` + (n < list.length ? '\n(실행 중인 검색은 남습니다)' : ''))) return;
  try { await api('/api/runs', {method: 'DELETE'}); current = null; await refresh(); renderForm(); } catch (err) { alert(err.message); }
};
setInterval(async () => { if (!POP && !timer && view !== 'settings' && view !== 'auth') { try { await refresh(); } catch {} } }, 8000);
setInterval(() => { if (!POP && view !== 'auth' && !document.hidden) loadAuth(); }, 5 * 60 * 1000);  // 로그인 상태는 가끔만 다시 확인한다

// --- 이스터 에그: 엠블럼을 5번 연달아 누르거나, 입력칸 밖에서 eureka 라고 치면 ---
const LINES = [
  '유레카! …그런데 누군가 이미 출원했을지도 모릅니다.',
  '세상에 새로운 것은 없다지만, 그래도 한 번 더 찾아봅시다.',
  '선행기술이 없으면 좋은 소식, 있으면 더 일찍 알아서 좋은 소식.',
  '오늘의 검색식에 행운이 깃들기를. and, or, not.',
];
let clicks = [], typed = '';
function eureka() {
  const img = $('#emblem'); img.classList.remove('spin1'); void img.offsetWidth; img.classList.add('spin1');
  for (let i = 0; i < 36; i++) {
    const b = document.createElement('div'); b.className = 'bulb'; b.textContent = i % 6 === 0 ? '🔍' : '💡';
    b.style.left = Math.random() * 100 + 'vw'; b.style.animationDuration = 2.2 + Math.random() * 2.4 + 's'; b.style.animationDelay = Math.random() * 0.9 + 's';
    document.body.appendChild(b); setTimeout(() => b.remove(), 6000);
  }
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = '💡 ' + LINES[Math.floor(Math.random() * LINES.length)];
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}
$('#emblem').onclick = () => { const now = Date.now(); clicks = clicks.filter(t => now - t < 2500); clicks.push(now); if (clicks.length >= 5) { clicks = []; eureka(); } };
document.addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,select') || !e.key || e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-6); if (typed === 'eureka') { typed = ''; eureka(); }
});

if (POP) {  // 구성대비 결과만 띄운 창: 옆 칸 없이 결과만 그리고, 본 창에서 결과가 바뀌면 따라 그린다
  document.body.classList.add('pop'); renderPop();
  if (bc) bc.onmessage = e => { if ((e.data || {}).id === POP) renderPop(); };
} else refresh().then(() => { loadAuth(); return app.running ? select(app.running) : renderForm(); }).catch(e => { $('#view').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; });
</script>
</body></html>
